<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mock Test Platform{% endblock %}</title>
    <!-- We can put shared Chart.js or CSS here later -->
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; margin: 0; }
        .navbar { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; transition: 0.2s; }
        .nav-links a:hover { color: #94a3b8; }
        .content { padding: 40px 20px; max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 1.2em; font-weight: bold;">GATE Prep</div>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'test_list' %}">Take a Test</a>
                <a href="{% url 'logout' %}">Logout ({{ user.username }})</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
