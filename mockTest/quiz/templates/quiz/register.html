{% extends 'quiz/base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<style>
    .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 400px; margin: 40px auto; }
    .form-group { margin-bottom: 20px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; margin-top: 5px; }
    .btn { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .footer-text { text-align: center; margin-top: 20px; color: #64748b; font-size: 14px; }
    .errorlist { color: #ef4444; font-size: 13px; padding-left: 20px; }
</style>

<div class="auth-card">
    <h2 style="margin-top: 0; text-align: center;">Create Account</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="errorlist">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn">Sign Up</button>
    </form>
    <div class="footer-text">Already have an account? <a href="{% url 'login' %}" style="color: #3b82f6;">Log In</a></div>
</div>
{% endblock %}
